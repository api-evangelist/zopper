aid: zopper
name: Zopper
description: 'Zopper is an Indian insurtech platform that combines insurance and technology
  to deliver end-to-end, embedded insurance distribution for its partners. It builds APIs
  that let banks, consumer-electronics brands, retailers, e-commerce, travel and fintech
  platforms embed insurance into their customer journeys, and it manages policy issuance,
  servicing, claims and compliance across consumer-durables protection, life, health,
  bancassurance and embedded insurance. Zopper serves 2,500+ brands including Bank of
  Baroda, Axis Bank, IDFC First Bank, Apple, Samsung, Croma and Vijay Sales, and is backed
  by Bessemer Venture Partners.'
